name: Fast code checks

# One automatic check per ready code PR; no duplicate push-to-main build.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'styles/**'
      - 'dev/**'
      - 'scripts/**'
      - 'tests/**'
      - 'e2e/**'
      - 'research-tests/**'
      - '.github/workflows/**'
      - 'package*.json'
      - '*config*'
      - 'Dockerfile*'
      - '*compose*.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare clean synthetic environments (no running services)
        run: bash scripts/ci-prepare.sh
      - run: npm ci
      - name: Check types, build and run database-free regression
        run: bash scripts/ci-fast.sh

  impersonation-smoke:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'security/agent-impersonation-smoke-')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      COMPOSE_PROJECT_NAME: synthetic-impersonation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure public Docker registry cache
        run: bash scripts/ci-images.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare isolated synthetic environments
        run: bash scripts/ci-prepare.sh
      - name: Install dependencies
        run: npm ci
      - name: Generate database clients
        run: |
          npx prisma generate --schema apps/delegate/prisma/schema.prisma
          npx prisma generate --schema apps/hmrc/prisma/schema.prisma
          npx prisma generate --schema apps/observatory/prisma/schema.prisma
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Host synthetic prototype on isolated runner
        run: |
          docker compose up -d --build db simulator onelogin delegate hmrc
          for url in http://localhost:3301/.well-known/openid-configuration http://localhost:3300/api/catalogues/hmrc-personal-tax http://localhost:3302/; do
            ready=0
            for attempt in $(seq 1 90); do
              if curl --fail --silent --output /dev/null --connect-timeout 2 --max-time 4 "$url"; then ready=1; break; fi
              sleep 2
            done
            if [ "$ready" != 1 ]; then echo "Not ready: $url"; exit 1; fi
            echo "Ready: $url"
          done
      - name: Test user-session impersonation without Delegate
        run: npx playwright test e2e/agent-impersonation-smoke.spec.ts --reporter=list
      - name: Compare identified agent using human credentials
        run: npx playwright test e2e/agents.spec.ts --grep "an agent using Sam's password is still the agent" --reporter=list
      - name: Collect redacted diagnostics
        if: always()
        run: |
          mkdir -p ci-artifacts
          docker compose ps -a > ci-artifacts/stack-status.txt 2>&1 || true
          docker compose logs --no-color 2>&1 | node scripts/ci-redact.mjs > ci-artifacts/stack.log || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-impersonation-${{ github.run_id }}
          path: |
            ci-artifacts/
            test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Clean isolated stack
        if: always()
        run: docker compose down --volumes --remove-orphans
