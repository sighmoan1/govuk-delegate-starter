name: WhenIsBins component tests
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: whenisbins-components-${{ github.ref }}
  cancel-in-progress: true

jobs:
  components:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install fixture browser only when email adapter exists
        run: |
          if test -f packages/whenisbins-email/package.json; then npx playwright install --with-deps chromium; fi
      - name: Typecheck and test available connector components
        run: |
          for component in apps/whenisbins packages/whenisbins-email packages/whenisbins-runner; do
            if test -f "$component/package.json"; then
              npm run typecheck -w "$component"
              npm test -w "$component"
            fi
          done
