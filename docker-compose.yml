# GOV.UK Delegate prototype: four services, so the boundaries are real.
#   docker compose up --build            everything
#   docker compose up -d db simulator    just the dependencies, for `npm run dev`
#   npm run public / npm run public:stop  the same stack on temporary public URLs (see scripts/public.mjs)
# Ports: Delegate 3300 · One Login 3301 (simulator behind it on 3399) · HMRC 3302 · About 3304 · Postgres 5433
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: delegate
      POSTGRES_PASSWORD: delegate
      POSTGRES_DB: delegate
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./dev/db-init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delegate"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The official GOV.UK One Login simulator does the OIDC work. People never see
  # it: the onelogin app on :3301 shows the sign-in screens and proxies every
  # other path (discovery, keys, token, userinfo) to it. Exposed on 3399 for dev.
  simulator:
    image: ghcr.io/govuk-one-login/simulator:latest
    ports:
      - "3399:3000"
    environment:
      SIMULATOR_URL: ${ONELOGIN_PUBLIC_URL:-http://localhost:3301}
      INTERACTIVE_MODE: "false"
      CLIENT_ID: delegate-dev-client
      # Public half of the simulator's documented default test key pair.
      # The matching private key lives in dev/oidc-client-private.pem.
      PUBLIC_KEY: "-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----"
      SCOPES: openid,email
      # The simulator supports one client. Delegate and HMRC share it here; in
      # production they would be separate relying parties of One Login.
      REDIRECT_URLS: ${DELEGATE_PUBLIC_URL:-http://localhost:3300}/auth/callback,${HMRC_PUBLIC_URL:-http://localhost:3302}/auth/callback
      POST_LOGOUT_REDIRECT_URLS: ${DELEGATE_PUBLIC_URL:-http://localhost:3300}/
      IDENTITY_VERIFICATION_SUPPORTED: "false"
      CLAIMS: ""

  onelogin:
    build:
      context: .
      dockerfile: apps/onelogin/Dockerfile
      args:
        SIMULATOR_INTERNAL_URL: http://simulator:3000
    depends_on:
      - simulator
    ports:
      - "3301:3301"
    environment:
      SIMULATOR_INTERNAL_URL: http://simulator:3000
      ABOUT_URL: http://localhost:3304
      DEMO_EMAIL: sam.taylor@example.com
      ONELOGIN_DEMO_PASSWORD: ${ONELOGIN_DEMO_PASSWORD:-password}
      DEMO_CONSOLE_KEY: ${DEMO_CONSOLE_KEY:-dev-demo-console-key}
      PUBLIC_MODE: ${PUBLIC_MODE:-false}

  delegate:
    build:
      context: .
      dockerfile: apps/delegate/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      simulator:
        condition: service_started
    ports:
      - "3300:3300"
    environment:
      DATABASE_URL: postgresql://delegate:delegate@db:5432/delegate
      PUBLIC_MODE: ${PUBLIC_MODE:-false}
      APP_URL: ${DELEGATE_PUBLIC_URL:-http://localhost:3300}
      # Browser-facing issuer vs. the address the app container uses server-side.
      OIDC_ISSUER: ${ONELOGIN_PUBLIC_URL:-http://localhost:3301}
      OIDC_INTERNAL_URL: http://simulator:3000
      OIDC_CLIENT_ID: delegate-dev-client
      OIDC_PRIVATE_KEY_FILE: ../../dev/oidc-client-private.pem
      SESSION_SECRET: ${DELEGATE_SESSION_SECRET:-dev-only-session-secret-change-me-0123456789}
      AGENT_TOKEN_SECRET: ${AGENT_TOKEN_SECRET:-dev-only-agent-token-secret-change-me-0123456789}
      DEMO_AGENT_CLIENT_ID: demo-personal-agent
      DEMO_AGENT_CLIENT_SECRET: ${AGENT_CLIENT_SECRET:-dev-demo-agent-secret}
      HMRC_SERVICE_KEY: ${HMRC_SERVICE_KEY:-dev-hmrc-service-key}
      ABOUT_URL: http://localhost:3304
      DEMO_CONSOLE_KEY: ${DEMO_CONSOLE_KEY:-dev-demo-console-key}

  hmrc:
    build:
      context: .
      dockerfile: apps/hmrc/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      delegate:
        condition: service_started
    ports:
      - "3302:3302"
    environment:
      DATABASE_URL: postgresql://delegate:delegate@db:5432/hmrc
      PUBLIC_MODE: ${PUBLIC_MODE:-false}
      APP_URL: ${HMRC_PUBLIC_URL:-http://localhost:3302}
      OIDC_ISSUER: ${ONELOGIN_PUBLIC_URL:-http://localhost:3301}
      OIDC_INTERNAL_URL: http://simulator:3000
      OIDC_CLIENT_ID: delegate-dev-client
      OIDC_PRIVATE_KEY_FILE: ../../dev/oidc-client-private.pem
      SESSION_SECRET: ${HMRC_SESSION_SECRET:-dev-only-hmrc-session-secret-change-me-0123456789}
      DELEGATE_URL: ${DELEGATE_PUBLIC_URL:-http://localhost:3300}
      DELEGATE_INTERNAL_URL: http://delegate:3300
      DELEGATE_SERVICE_SLUG: hmrc-personal-tax
      HMRC_SERVICE_KEY: ${HMRC_SERVICE_KEY:-dev-hmrc-service-key}
      ABOUT_URL: http://localhost:3304
      DEMO_CONSOLE_KEY: ${DEMO_CONSOLE_KEY:-dev-demo-console-key}

  # Not part of the scenario: the prototype's own notes and demo console.
  about:
    build:
      context: .
      dockerfile: apps/about/Dockerfile
    depends_on:
      - onelogin
      - delegate
      - hmrc
    ports:
      - "3304:3304"
    environment:
      DELEGATE_URL: ${DELEGATE_PUBLIC_URL:-http://localhost:3300}
      DELEGATE_INTERNAL_URL: http://delegate:3300
      HMRC_URL: ${HMRC_PUBLIC_URL:-http://localhost:3302}
      HMRC_INTERNAL_URL: http://hmrc:3302
      ONE_LOGIN_URL: ${ONELOGIN_PUBLIC_URL:-http://localhost:3301}
      ONE_LOGIN_INTERNAL_URL: http://onelogin:3301
      DEMO_CONSOLE_KEY: ${DEMO_CONSOLE_KEY:-dev-demo-console-key}
      HMRC_MIDDLEWARE_FILE: ../hmrc/src/lib/delegated-authority.ts

volumes:
  dbdata:
