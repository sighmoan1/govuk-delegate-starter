services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: delegate
      POSTGRES_PASSWORD: delegate
      POSTGRES_DB: delegate
    ports: ["127.0.0.1:55435:5432"]
    volumes:
      - whenisbins-test-data:/var/lib/postgresql/data
      - ../../dev/db-init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delegate"]
      interval: 3s
      timeout: 3s
      retries: 20
  simulator:
    image: ghcr.io/govuk-one-login/simulator:latest
    ports: ["127.0.0.1:5799:3000"]
    environment:
      SIMULATOR_URL: http://localhost:5701
      INTERACTIVE_MODE: "false"
      CLIENT_ID: delegate-dev-client
      SCOPES: openid,email
      REDIRECT_URLS: http://localhost:5700/auth/callback,http://localhost:5702/auth/callback
      POST_LOGOUT_REDIRECT_URLS: http://localhost:5700/
      IDENTITY_VERIFICATION_SUPPORTED: "false"
      CLAIMS: ""
      PUBLIC_KEY: "-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----"
volumes:
  whenisbins-test-data:
